name: Catalog changelog

# Posts an applab catalog changelog to the webhook whenever the app catalog
# (const APPS in index.html) changes on main — regardless of whether it was
# edited locally or on github.com. The webhook URL is a repo secret (WEBHOOK_URL),
# so it is never committed.
on:
  push:
    branches: [main]
    paths: ['index.html']

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can diff the pushed range
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Post catalog changelog
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python tools/catalog_changelog.py --git "${{ github.event.before }}" "${{ github.event.after }}"
